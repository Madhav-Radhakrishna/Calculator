<template>
    <lightning-card title="Student Mentor" icon-name="standard:people">

        <div class="slds-p-around_medium">

            <!-- Select Mentor -->
            <lightning-combobox
                name="mentor"
                label="Select Mentor"
                placeholder="Select a Mentor"
                options={mentorOptions}
                value={selectedMentorId}
                onchange={handleMentorChange}>
            </lightning-combobox>

            <!-- Selected Mentor -->
            <template if:true={selectedMentorName}>
                <div class="slds-m-top_medium">
                    <p>
                        <strong>Mentor:</strong> {selectedMentorName}
                    </p>
                </div>
            </template>

            <!-- Number of Students -->
            <template if:true={showStudentDetails}>
                <div class="slds-m-top_medium">
                    <p>
                        <strong>Number of Students:</strong> {studentCount}
                    </p>
                </div>

                <!-- Student List -->
                <div class="slds-m-top_medium">
                    <p><strong>Students:</strong></p>

                    <template if:true={students.length}>
                        <ol class="slds-list_ordered slds-m-top_small">
                            <template for:each={students} for:item="student">
                                <li key={student.Id}>
                                    {student.Name}
                                </li>
                            </template>
                        </ol>
                    </template>

                    <template if:false={students.length}>
                        <p>No students found.</p>
                    </template>
                </div>
            </template>

        </div>

    </lightning-card>
</template>
